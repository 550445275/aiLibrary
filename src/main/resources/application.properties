# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=test
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.library.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 新库首次启动时执行 classpath:schema.sql（表已存在则 IF NOT EXISTS 跳过）
spring.sql.init.mode=always

server.port=8080

# API 错误响应中带上业务原因，便于前端与调试（如 ResponseStatusException 的 message）
server.error.include-message=always
